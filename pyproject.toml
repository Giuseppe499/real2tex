[project]
name = "real2tex"
version = "2.0.0"
authors = [
  {name="Giuseppe Scarlato"},
]
description = "Converts a number to a LaTeX string in scientific notation."
readme = "README.md"
requires-python = ">=3.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
[project.urls]
Homepage = "https://github.com/Giuseppe499/real2tex"
Issues = "https://github.com/Giuseppe499/real2tex/issues"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]

[dependency-groups]
dev = [
    "pytest>=4.6.11",
    "ruff>=0.0.17",
]
